<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      .inter {
        font-family: "Inter", sans-serif;
      }

      .noto {
        font-family: "Noto Serif", serif;
      }
    </style>
    <title>Flower Market</title>
  </head>
  <body class="m-0 p-0">
    <!-- nav section -->
    <nav
      class="mx-[150px] mt-[30px] mb-[120px] flex flex-row justify-between items-center"
    >
      <img src="./assets/logo.png" alt="" />
      <div
        class="flex flex-row justify-between items-center gap-12 inter text-base text-[#8987a1] font-normal"
      >
        <a href="#" class="text-[#252432] font-bold">Home</a>
        <a href="#">Shop</a>
        <a href="#">About Us</a>
        <a
          href="#"
          class="flex flex-row justify-between items-center gap-[10px]"
          ><i class="fa-solid fa-cart-shopping"></i>Cart ($56)</a
        >
      </div>
    </nav>
    <!-- nav section -->

    <!-- banner section -->
    <section class="flex flex-row mx-[150px] justify-between items-end">
      <div class="flex flex-col justify-between items-start gap-[13px]">
        <h1 class="noto text-black text-[65px] font-bold uppercase">
          Always <span class="text-[#e95a08]">Fresh Flowers</span>
        </h1>
        <p class="text-[#00000080] inter font-normal text-[22px]">
          Indulge your senses with the beauty and fragrance of our fresh flower
          shop. From classic roses to exotic blooms, we offer a wide variety of
          fresh flowers that are perfect for any occasion.
        </p>
      </div>
      <img src="./assets/hero-flower.png" alt="" />
    </section>
    <!-- banner section -->
  </body>
</html>
